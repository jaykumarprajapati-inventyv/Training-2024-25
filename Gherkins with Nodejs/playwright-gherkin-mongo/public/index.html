<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playwright Report</title>
  <script>
    // Function to trigger the API call and fetch the report
    async function fetchReport() {
      const response = await fetch('/generate-report');
      if (response.ok) {
        window.location.href = '/report'; // Redirect to the Playwright test report
      } else {
        alert('Failed to generate the report');
      }
    }
  </script>
</head>
<body>
  <h1>Playwright Test Report</h1>
  <button onclick="fetchReport()">Generate Test Report</button>
</body>
</html>
