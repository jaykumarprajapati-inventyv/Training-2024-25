[package]
name = "own_product"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
dotenv = "0.15.0"
sqlx = {version = "0.8.3", features = ["mysql", "runtime-tokio-rustls"] }
tokio = { version = "1.44.0", features = ["full"] }
validator = { version = "0.20.0", features = ["derive"] }
jsonwebtoken = "9.3.1"
chrono = "0.4.40"
